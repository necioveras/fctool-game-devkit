<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="pragma" content="no-cache">
  <title>Shell's Virtual Escape</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
      touch-action: none;
    }
    .gm4html5_div_class {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: optimizeSpeed;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      touch-action: none;
    }
    #fctool-error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #002133;
      color: #f3f3f3;
      font: 600 18px/1.4 system-ui, sans-serif;
      text-align: center;
      z-index: 9999;
    }
    #fctool-error[hidden] { display: none; }
    #touch-controls {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body.fctool-touch-enabled #touch-controls { display: block; }
    .touch-cluster {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }
    .touch-cluster--move { left: max(18px, env(safe-area-inset-left)); }
    .touch-cluster--actions { right: max(18px, env(safe-area-inset-right)); }
    .touch-secondary {
      display: grid;
      grid-template-columns: repeat(2, 48px);
      gap: 8px;
    }
    .touch-button {
      width: 64px;
      height: 64px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      padding: 0;
      pointer-events: auto;
      touch-action: none;
      background: rgba(0, 33, 51, 0.68);
      color: #fff;
      font: 700 24px/1 system-ui, sans-serif;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    .touch-button--small {
      width: 48px;
      height: 48px;
      font-size: 15px;
    }
    .touch-button--wide {
      width: 72px;
      height: 72px;
      font-size: 13px;
    }
    .touch-button.is-active {
      background: rgba(0, 151, 167, 0.88);
      transform: scale(0.94);
    }
    .touch-pause {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
    }
    @media (max-height: 430px) {
      .touch-cluster { bottom: max(8px, env(safe-area-inset-bottom)); gap: 8px; }
      .touch-button { width: 56px; height: 56px; }
      .touch-button--small { width: 42px; height: 42px; }
      .touch-button--wide { width: 62px; height: 62px; }
    }
  </style>
</head>
<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <canvas id="canvas" width="960" height="540">
      <p>Seu navegador não suporta HTML5 canvas.</p>
    </canvas>
  </div>
  <div id="fctool-error" hidden></div>
  <div id="touch-controls" aria-label="Controles de toque">
    <button class="touch-button touch-button--small touch-pause" type="button" data-key="27" aria-label="Pausar">II</button>
    <div class="touch-cluster touch-cluster--move">
      <button class="touch-button" type="button" data-key="65" aria-label="Mover para esquerda">&#9664;</button>
      <button class="touch-button" type="button" data-key="68" aria-label="Mover para direita">&#9654;</button>
    </div>
    <div class="touch-cluster touch-cluster--actions">
      <div class="touch-secondary">
        <button class="touch-button touch-button--small" type="button" data-key="81" aria-label="Estrutura anterior">Q</button>
        <button class="touch-button touch-button--small" type="button" data-key="69" aria-label="Próxima estrutura">E</button>
      </div>
      <button class="touch-button touch-button--wide" type="button" data-key="70" aria-label="Interagir">INTERAGIR</button>
      <button class="touch-button touch-button--wide" type="button" data-key="32" aria-label="Pular">PULAR</button>
    </div>
  </div>

  <script src="fctool-game-sdk.js"></script>
  <script src="html5game/Shell's Virtual Escape.js"></script>
  <script src="fctool-adapter.js"></script>
  <script>
    window.addEventListener("load", function () {
      window.FCToolShellEscapeAdapter.boot();
    });
  </script>
</body>
</html>
