<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="pragma" content="no-cache">
  <title>Shell's Virtual Escape</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
      touch-action: none;
    }
    .gm4html5_div_class {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: optimizeSpeed;
      -webkit-interpolation-mode: nearest-neighbor;
      -ms-touch-action: none;
      touch-action: none;
    }
    #fctool-error {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: #002133;
      color: #f3f3f3;
      font: 600 18px/1.4 system-ui, sans-serif;
      text-align: center;
      z-index: 9999;
    }
    #fctool-error[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">
    <canvas id="canvas" width="960" height="540">
      <p>Seu navegador não suporta HTML5 canvas.</p>
    </canvas>
  </div>
  <div id="fctool-error" hidden></div>

  <script src="fctool-game-sdk.js"></script>
  <script src="html5game/Shell's Virtual Escape.js"></script>
  <script src="fctool-adapter.js"></script>
  <script>
    window.addEventListener("load", function () {
      window.FCToolShellEscapeAdapter.boot();
    });
  </script>
</body>
</html>
